<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Editorial Team | CyberIndex</title>
    <link rel="stylesheet" href="index.html">
    <style>
        :root { --bg: #0b0f17; --card: #151c28; --border: #232d3f; --accent: #2563eb; --text: #f8fafc; --muted: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; padding-bottom: 40px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; font-weight: 600; list-style: none; }
        .nav-links a { color: var(--muted); text-decoration: none; }
        .nav-links a.active { color: #fff; }
        input, textarea { width: 100%; padding: 12px; background: #0b0f17; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 16px; font-family: inherit; }
        button { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <header class="nav-bar">
            <a href="index.html" style="font-weight: 800; color: #fff; text-decoration: none; font-size: 18px;">CyberIndex<span style="color:var(--accent)">.2026</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Ranking</a></li>
                <li><a href="comparison-matrix.html">Matrix</a></li>
                <li><a href="guides.html">Guides</a></li>
                <li><a href="tools.html">Tools</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contacts.html" class="active">Contacts</a></li>
            </ul>
        </header>

        <h1 style="font-size: 2rem; margin-bottom: 10px;">Contact Editorial Team</h1>
        <p style="color: var(--muted); margin-bottom: 24px;">Got a platform review request or want to report an inaccuracy? Drop us a line.</p>

        <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Business Email" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
